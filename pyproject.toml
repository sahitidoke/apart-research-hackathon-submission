dependencies = [
    "modal>=1.5.5",
]

[tool.pytest.ini_options]
testpaths = ["tests", "orchestrator/simulated_web", "orchestrator/provenance"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
